# ============================================================
# Pages CMS 설정 파일 (app.pagescms.org)
#
# 이 파일은 글쓰기 화면이 어떻게 생길지를 정합니다.
# 여기에 적은 label 이 그대로 입력칸 이름으로 보입니다.
#
# 쓰는 법
#   1. 이 저장소를 GitHub 에 올립니다.
#   2. app.pagescms.org 에 GitHub 계정으로 로그인합니다.
#   3. 이 저장소를 고르면 아래 내용대로 글쓰기 화면이 만들어집니다.
# ============================================================

# 이미지를 올리면 images 폴더에 저장됩니다
media:
  input: images
  output: /images

content:

  # ---------- 작업 목록 ----------
  - name: works
    label: 작업 목록
    type: file
    path: data/works.json
    fields:
      - name: works
        label: 작업
        type: object
        list: true
        fields:
          - name: id
            label: 주소 이름
            type: string
            description: 영문 소문자로. 상세 페이지 주소가 됩니다 (예 sujip → /work/sujip)
          - name: year
            label: 연도
            type: string
            description: 예) 2026  또는  2025–2026
          - name: title
            label: 작업 이름
            type: string
          - name: summary
            label: 한 줄 설명
            type: string
            description: 첫 화면 목록에 보이는 줄
          - name: thumbnail
            label: 썸네일 이미지
            type: image
            description: 상세 페이지 맨 위에 보이는 화면 미리보기
          - name: description
            label: 작업 설명
            type: text
            description: 상세 페이지 본문. 빈 줄로 나누면 문단이 나뉩니다
          - name: links
            label: 사이트 링크
            type: object
            list: true
            fields:
              - name: label
                label: 보이는 글자
                type: string
              - name: url
                label: 주소
                type: string

  # ---------- 노트 ----------
  - name: notes
    label: 노트
    type: file
    path: data/notes.json
    fields:
      - name: notes
        label: 노트
        type: object
        list: true
        fields:
          - name: id
            label: 주소 이름
            type: string
            description: 영문 소문자로. 상세 페이지 주소가 됩니다 (예 site-log → /note/site-log)
          - name: year
            label: 연도
            type: string
            description: 예) 2026  또는  2025–2026
          - name: title
            label: 제목
            type: string
          - name: summary
            label: 한 줄 설명
            type: string
            description: 첫 화면 목록에 보이는 줄
          - name: thumbnail
            label: 이미지
            type: image
            description: 상세 페이지 맨 위에 보입니다. 비워 두면 글만 나옵니다
          - name: description
            label: 본문
            type: text
            description: 빈 줄로 나누면 문단이 나뉩니다
          - name: links
            label: 링크
            type: object
            list: true
            fields:
              - name: label
                label: 보이는 글자
                type: string
              - name: url
                label: 주소
                type: string

  # ---------- 스터디 ----------
  - name: studies
    label: 스터디
    type: file
    path: data/studies.json
    fields:
      - name: studies
        label: 스터디
        type: object
        list: true
        fields:
          - name: id
            label: 주소 이름
            type: string
            description: 영문 소문자로. 상세 페이지 주소가 됩니다 (예 aistudy → /study/aistudy)
          - name: year
            label: 연도
            type: string
            description: 예) 2026  또는  2025–2026
          - name: title
            label: 제목
            type: string
          - name: summary
            label: 한 줄 설명
            type: string
            description: 첫 화면 목록에 보이는 줄
          - name: thumbnail
            label: 이미지
            type: image
            description: 상세 페이지 맨 위에 보입니다. 비워 두면 글만 나옵니다
          - name: description
            label: 본문
            type: text
            description: 빈 줄로 나누면 문단이 나뉩니다
          - name: items
            label: 체크 목록
            description: 하나씩 해 나가는 스터디에 씁니다. 비워 두면 본문만 나옵니다
            type: object
            list: true
            fields:
              - name: group
                label: 단계
                type: string
                description: 예) 그리기. 같은 단계가 이어지면 화면에는 첫 줄에만 보입니다
              - name: title
                label: 이름
                type: string
              - name: url
                label: 주소
                type: string
              - name: note
                label: 해볼 것
                type: string
              - name: done
                label: 완료
                type: boolean
                default: false
          - name: links
            label: 링크
            type: object
            list: true
            fields:
              - name: label
                label: 보이는 글자
                type: string
              - name: url
                label: 주소
                type: string

  # ---------- 사이트 기본 정보 ----------
  - name: site
    label: 사이트 정보
    type: file
    path: data/site.json
    fields:
      - name: nameKo
        label: 이름 (한글)
        type: string
      - name: nameEn
        label: 이름 (영문)
        type: string
      - name: about
        label: 소개
        type: text
      - name: colophon
        label: 맨 아래 한 줄
        type: string
      - name: nav
        label: 위쪽 메뉴
        type: object
        list: true
        fields:
          - name: label
            label: 메뉴 이름
            type: string
          - name: href
            label: 주소
            type: string
      - name: contact
        label: 연락처
        type: object
        list: true
        fields:
          - name: label
            label: 보이는 글자
            type: string
          - name: href
            label: 주소
            type: string
